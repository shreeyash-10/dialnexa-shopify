# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fafc65df8aa91ca91e66cbf53455b3a4"
name = "dialnexa"
application_url = "https://dialedin-pi.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_fulfillments,read_inventory,read_orders,read_own_subscription_contracts,read_products"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/risk-assessment-changed"
  topics = [ "orders/risk_assessment_changed" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillment-events/create"
  topics = [ "fulfillment_events/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory-levels/update"
  topics = [ "inventory_levels/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-billing-attempts/failure"
  topics = [ "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [
  "https://dialedin-pi.vercel.app/api/auth",
  "https://dialedin-pi.vercel.app/auth/callback",
  "https://dialedin-pi.vercel.app/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true
